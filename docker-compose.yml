services:
  library:
    build: .
    image: spring-library-app:1.0
    container_name: spring-library
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - library-data:/data
    networks:
      - library-net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  library-data:

networks:
  library-net:
    driver: bridge
